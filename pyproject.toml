[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetctl"
version = "0.4.0"
description = "Cross-platform compliant device management toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "fleetctl Team", email = "team@fleetctl.io"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "pymobiledevice3>=4.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-aiofiles>=23.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/fleetctl/fleetctl"
Repository = "https://github.com/fleetctl/fleetctl"
Issues = "https://github.com/fleetctl/fleetctl/issues"

[project.scripts]
fleetctl = "fleetctl.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleetctl*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | src-tauri
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
    "W291",  # trailing whitespace
    "W292",  # missing newline at end of file
    "W293",  # blank line contains whitespace
    "UP006",  # PEP 585 built-in generics
    "UP015",  # redundant open modes
    "UP024",  # os.error -> OSError alias
    "UP035",  # deprecated imports
    "UP037",  # quoted annotations
    "UP042",  # str + Enum -> StrEnum
    "UP045",  # PEP 604 optional annotations
    "F401",  # unused imports (re-exports / pre-existing)
    "F601",  # repeated dict key literal (intentional tables)
    "F811",  # redefinition (intentional re-exports in __init__)
    "F841",  # unused local variable (pre-existing)
    "F541",  # f-string without placeholders
    "B007",  # unused loop control variable
    "C408",  # unnecessary collection call
    "I001",  # import sorting (pre-existing style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pymobiledevice3.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["python-core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]