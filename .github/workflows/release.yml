name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------- #
  # 1. Build Python distributions                                     #
  # ---------------------------------------------------------------- #
  build-python:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  # ---------------------------------------------------------------- #
  # 2. Build standalone binaries per platform                         #
  # ---------------------------------------------------------------- #
  build-binary-macos:
    name: Build macOS binary + signed/notarized .dmg
    runs-on: macos-latest
    env:
      FLEETCTL_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Import Developer ID certificate
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Install
        run: pip install -e ".[dev,pdf]" pyinstaller
      - name: Build binary
        run: make binary
      - name: Build, sign and notarize DMG
        run: bash scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - name: Verify signature and notarization
        if: env.FLEETCTL_SIGN_IDENTITY != ''
        run: |
          codesign --verify --strict --verbose=2 dist/fleetctl
          xcrun stapler validate dist/*.dmg
          spctl --assess --type open --context context:primary-signature -v dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.dmg

  build-binary-linux:
    name: Build Linux binary + signed .AppImage
    runs-on: ubuntu-latest
    env:
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -e ".[dev,pdf]" pyinstaller
      - name: Build binary
        run: make binary
      - name: Build and sign AppImage
        run: bash scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Verify GPG signature
        if: env.LINUX_GPG_PRIVATE_KEY != ''
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --verify dist/*.AppImage.asc dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.asc

  build-binary-windows:
    name: Build Windows binary + signed .msi
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -e ".[dev,pdf]" pyinstaller
      - name: Build binary
        run: pyinstaller --clean --noconfirm --name fleetctl --onefile --console --collect-all pymobiledevice3 fleetctl/main.py
      - name: Build and sign MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ github.ref_name }}".Replace("v","")
      - name: Verify Authenticode signature
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem dist -Filter *.msi
          if (-not $artifacts) { throw "No MSI produced" }
          foreach ($file in $artifacts) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Invalid signature on $($file.Name): $($sig.Status)"
            }
            Write-Host "[+] Verified: $($file.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  # ---------------------------------------------------------------- #
  # 3. Publish GitHub Release                                         #
  # ---------------------------------------------------------------- #
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python, build-binary-macos, build-binary-linux, build-binary-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -la release-assets/
      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "## What's Changed"
            git log --pretty=format:'- %s (%h)' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)"..HEAD 2>/dev/null || git log --pretty=format:'- %s (%h)' -10
          } > CHANGELOG_BODY.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.draft == 'true' || github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          body_path: CHANGELOG_BODY.md
          files: release-assets/*
